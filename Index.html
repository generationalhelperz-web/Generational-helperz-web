<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenerationalHelperZ | Digital Creator</title>
    
    <!-- PINTEREST VERIFICATION CODE GOES HERE -->
    <!-- Replace the line below with the exact <meta> tag Pinterest gives you -->
    <meta name="p:domain_verify" content="YOUR_PINTEREST_CODE_HERE"/>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f5f5f5;
            --accent-color: #c0a062; /* Subtle luxury gold */
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }
        /* Exact Brand Formatting */
        .brand-name {
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .brand-name .z-large {
            font-size: 1.3em; 
            color: var(--accent-color);
        }
        header {
            padding: 100px 0 50px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 40px;
        }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 40px 0;
        }
        .link-btn {
            display: block;
            padding: 18px 25px;
            background-color: #1a1a1a;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background-color: #2a2a2a;
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        footer {
            margin-top: auto;
            padding: 30px 0;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header class="container">
        <h1>
            <span class="brand-name">GenerationalHelper<span class="z-large">Z</span></span>
        </h1>
        <p class="subtitle">Curating the best in aesthetics, tech, and digital growth.</p>
        
        <div class="links-grid">
            <!-- Replace the # with your actual profile links -->
            <a href="#" class="link-btn">📌 View my Pinterest (43k+ Monthly Views)</a>
            <a href="#" class="link-btn">📸 Follow on Instagram</a>
            <a href="mailto:your.email@gmail.com" class="link-btn">✉️ Business & Brand Inquiries</a>
        </div>
    </header>

    <footer class="container">
        <p>&copy; 2026 <span class="brand-name">GenerationalHelper<span class="z-large">Z</span></span>. All rights reserved.</p>
    </footer>

</body>
</html>
